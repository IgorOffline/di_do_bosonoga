[package]
name = "bosonoga"
version = "0.3.0"
edition = "2024"

[[test]]
name = "interpreter"
path = "test/interpreter.rs"

[dependencies]
quick-xml = { path = "../../../rust_vendor/quick-xml/current/quick-xml-0.42.0", default-features = false }
lalrpop-util = "0.23.2"

[build-dependencies]
lalrpop = "0.23.2"

[lints.rust]
warnings = "deny"                # -Werror
unsafe_code = "forbid"           # what UBSan and -Wnull-dereference guard against
unreachable_pub = "deny"         # -Wmissing-prototypes
unused_qualifications = "deny"   # -Wredundant-decls
unused_lifetimes = "deny"        # -Wunused
unused_macro_rules = "deny"      # -Wunused

[lints.clippy]
all = { level = "deny", priority = -1 }        # -Wall -Wextra
pedantic = { level = "deny", priority = -1 }   # -Wpedantic, -Wcast-qual, -Wcast-align, -Wfloat-equal
as_conversions = "deny"                        # -Wconversion -Wsign-conversion
shadow_reuse = "deny"                          # -Wshadow
shadow_same = "deny"                           # -Wshadow
shadow_unrelated = "deny"                      # -Wshadow
wildcard_enum_match_arm = "deny"               # -Wswitch-enum
float_cmp_const = "deny"                       # -Wfloat-equal
unwrap_used = "deny"                           # -Wnull-dereference
expect_used = "deny"                           # -Wnull-dereference
panic = "deny"                                 # -fno-sanitize-recover is for bugs, not errors
missing_errors_doc = "allow"                   # C11 had no doc requirement
manual_find = "allow"                          # plain search loops read better than iterator chains

# Every crate of the tree, so that Cargo.lock has no crates.io source or checksum.
[patch.crates-io]
# lalrpop
aho-corasick = { path = "../../../rust_vendor/lalrpop/current/aho-corasick-1.1.5" }
ascii-canvas = { path = "../../../rust_vendor/lalrpop/current/ascii-canvas-4.0.0" }
bit-set = { path = "../../../rust_vendor/lalrpop/current/bit-set-0.11.1" }
bit-vec = { path = "../../../rust_vendor/lalrpop/current/bit-vec-0.10.2" }
bitflags = { path = "../../../rust_vendor/lalrpop/current/bitflags-2.13.2" }
cfg-if = { path = "../../../rust_vendor/lalrpop/current/cfg-if-1.0.5" }
cpufeatures = { path = "../../../rust_vendor/lalrpop/current/cpufeatures-0.3.1" }
crypto-common = { path = "../../../rust_vendor/lalrpop/current/crypto-common-0.2.2" }
digest = { path = "../../../rust_vendor/lalrpop/current/digest-0.11.3" }
either = { path = "../../../rust_vendor/lalrpop/current/either-1.19.0" }
ena = { path = "../../../rust_vendor/lalrpop/current/ena-0.14.4" }
equivalent = { path = "../../../rust_vendor/lalrpop/current/equivalent-1.0.3" }
fixedbitset = { path = "../../../rust_vendor/lalrpop/current/fixedbitset-0.5.9" }
foldhash = { path = "../../../rust_vendor/lalrpop/current/foldhash-0.1.5" }
hashbrown_0_15_5 = { package = "hashbrown", path = "../../../rust_vendor/lalrpop/current/hashbrown-0.15.5" }
hashbrown_0_17_1 = { package = "hashbrown", path = "../../../rust_vendor/lalrpop/current/hashbrown-0.17.1" }
hybrid-array = { path = "../../../rust_vendor/lalrpop/current/hybrid-array-0.4.15" }
indexmap = { path = "../../../rust_vendor/lalrpop/current/indexmap-2.14.2" }
itertools = { path = "../../../rust_vendor/lalrpop/current/itertools-0.15.0" }
keccak = { path = "../../../rust_vendor/lalrpop/current/keccak-0.2.2" }
lalrpop = { path = "../../../rust_vendor/lalrpop/current/lalrpop-0.23.2" }
lalrpop-util = { path = "../../../rust_vendor/lalrpop/current/lalrpop-util-0.23.2" }
libc = { path = "../../../rust_vendor/lalrpop/current/libc-0.2.191" }
lock_api = { path = "../../../rust_vendor/lalrpop/current/lock_api-0.4.14" }
log = { path = "../../../rust_vendor/lalrpop/current/log-0.4.35" }
memchr = { path = "../../../rust_vendor/lalrpop/current/memchr-2.8.3" }
new_debug_unreachable = { path = "../../../rust_vendor/lalrpop/current/new_debug_unreachable-1.0.6" }
parking_lot = { path = "../../../rust_vendor/lalrpop/current/parking_lot-0.12.5" }
